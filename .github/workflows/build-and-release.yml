name: Build and release

on:
  push:
    branches:
      - maintenance/monorepo-win11
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: locale-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # windows-2019 was retired by GitHub on 2025-06-30. windows-2025 shares the Windows 11 24H2 kernel (build 26100)
      # the native Core was verified on; windows-2022 is build 20348. The hosted image is not
      # guaranteed to carry VS2019 (16.x), which the native toolchain scripts require, so install
      # the C++ build tools and Windows SDK 10.0.19041.0 when vswhere cannot find them.
      - name: Ensure Visual Studio 2019 Build Tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $found = & $vswhere -latest -products '*' -version '[16.0,17.0)' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.Windows10SDK.19041 -property installationPath
          if ([string]::IsNullOrWhiteSpace($found)) {
            choco install visualstudio2019buildtools --yes --no-progress --package-parameters '--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.Windows10SDK.19041'
            if ($LASTEXITCODE -notin 0, 3010) { throw "Visual Studio 2019 Build Tools install failed: exit $LASTEXITCODE" }
          }

      - name: Build, test, and package both architectures
        shell: pwsh
        run: pwsh -NoProfile -File ./build-dual.ps1

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-emulator-build
          if-no-files-found: warn
          path: |
            artifacts/package-dual/*.zip
            artifacts/logs/**
            artifacts/tests/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: locale-emulator-build
          path: release-output

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/artifacts/package-dual/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
