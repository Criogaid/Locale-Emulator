name: Build and release

on:
  push:
    branches:
      - master
      - maintenance/monorepo-win11
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: locale-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The hosted image already includes v142 x86/x64 and Windows SDK 26100.
      # Resolve those components without installing another Visual Studio instance.
      - name: Inspect preinstalled build toolchain
        shell: pwsh
        run: |
          . ./Native/Toolchain.ps1
          New-Item -ItemType Directory -Path artifacts/logs -Force | Out-Null
          Get-OfficialToolchain | ConvertTo-Json | Tee-Object -FilePath artifacts/logs/toolchain.json

      - name: Build, test, and package both architectures
        shell: pwsh
        run: pwsh -NoProfile -File ./build-dual.ps1

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locale-emulator-build
          if-no-files-found: warn
          path: |
            artifacts/package-dual/*.zip
            artifacts/logs/**
            artifacts/tests/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          name: locale-emulator-build
          path: release-output

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-output/package-dual/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
