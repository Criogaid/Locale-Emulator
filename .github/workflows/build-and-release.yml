name: Build and release

on:
  push:
    branches:
      - maintenance/monorepo-win11
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: locale-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2019
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, test, and package both architectures
        shell: pwsh
        run: pwsh -NoProfile -File ./build-dual.ps1

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-emulator-build
          if-no-files-found: warn
          path: |
            artifacts/package-dual/*.zip
            artifacts/logs/**
            artifacts/tests/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2019
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: locale-emulator-build
          path: release-output

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/artifacts/package-dual/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
